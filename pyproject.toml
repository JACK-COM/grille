[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grille"
dynamic = ["version"]
description = "Gives an agent only the pages of a document that answer its question, and withholds passages written to steer it."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.22"]

[project.scripts]
grille = "grille.grille:cli"

[project.urls]
Homepage = "https://github.com/JACK-COM/grille"

[tool.setuptools.dynamic]
version = {attr = "grille.grille.__version__"}

[tool.setuptools.package-data]
grille = ["INSTALL-grille.md"]

[tool.mypy]
# `make typecheck`. grille.py puts its own directory on the path, so src/grille is the import
# root; the underscore modules are panoply-lib copies, checked in panoply-lib.
python_version = "3.11"
files = ["src/grille"]
exclude = ['^src/grille/_[a-z]', '^src/grille/claude-mod/']
mypy_path = "src/grille"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Followed for their signatures only; _embed's relative import works only under the package.
module = ["_embed", "_guard", "_manifest_schema", "_scorer_contract", "_settings", "_web"]
follow_imports = "skip"
