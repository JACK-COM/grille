# Runs the offline selftest on Linux and macOS for every push and pull request.
# Read-only on purpose: no secrets, no write token, actions pinned by commit, and a
# checkout that keeps no credentials, so a workflow run can publish nothing. The
# panoply-lib copy check needs the private sibling repo and stays in the local
# pre-commit hook and release script.
name: selftest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install poppler
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; else brew install poppler; fi
      - name: Selftest
        run: python src/grille/grille.py selftest
