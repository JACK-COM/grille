# Runs tests/ and the install smoke check on Linux and macOS, and the WebFetch mod's tests,
# for every push and pull request.
# Read-only on purpose: no secrets, no write token, actions pinned by commit, and a
# checkout that keeps no credentials, so a workflow run can publish nothing. The
# panoply-lib copy check needs the private sibling repo and stays in the local
# pre-commit hook and release script.
name: selftest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install numpy
        run: python -m pip install numpy
      - name: Install poppler
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; else brew list poppler &>/dev/null || brew install poppler; fi
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Install smoke check
        run: python src/grille/grille.py selftest

  mod:
    # The mod's register.test.ts runs under Claude Code's own test runner, pinned as in the
    # makefile; it needs no account or key.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Mod tests
        run: npx --yes @anthropic-ai/claude-code@2.1.330 plugin test src/grille/claude-mod
